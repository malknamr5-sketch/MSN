.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.pi{height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;background:#17140a;overflow:hidden}

.em{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}

.note{background:var(--card);border-right:3px solid var(--g);padding:9px;font-size:12px;color:var(--mut);margin-bottom:10px;border-radius:4px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 0}footer a{color:var(--g2);margin:0 8px;text-decoration:none}
#t{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 18px;border-radius:30px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;z-index:200;max-width:92%;text-align:center}#t.on{opacity:1}

</style>
</head>

function keep(){const c=$("rc");if(c)R.c=c.value;R.items.forEach(x=>{const e=$("pc"+x.id);if(e)R["c"+x.id]=e.value})}
function setStar(t,v){keep();if(t==="app")R.app=v;else R.p[t.slice(1)]=v;drawRate()}
async function submitRate(){keep();const rows=[];
if(R.app)rows.push({product_id:null,rating:R.app,comment:(R.c||"").trim()||null});
R.items.forEach(x=>{if(R.p[x.id])rows.push({product_id:x.id,rating:R.p[x.id],comment:(R["c"+x.id]||"").trim()||null})});
if(!rows.length)return toast("اختار عدد النجوم الأول");
rows.forEach(r=>{r.order_token=R.token;r.name=R.name});
const r=await sb.from("reviews").insert(rows);
if(r.error)return toast(r.error.code==="23505"?"اتقيّم قبل كده، شكرًا ❤️":"تعذّر إرسال التقييم، جرّب تاني");
$("s4").classList.remove("on");toast("شكرًا على تقييمك ❤️");loadRev()}
function saveCart(){sv("msn_cart",cart);upd();drawCart()}
document.addEventListener("click",e=>{
if(e.target.classList.contains("sh")){e.target.classList.remove("on");return}
const t=e.target.closest("[data-k]");if(!t)return;const k=t.dataset.k,i=+t.dataset.i,v=t.dataset.v;
if(k==="adc"){rp("bump_ad",{aid:i,k:"click"});return}
if(k==="open"){cur=P.find(p=>p.id===i);if(cur){const sl=sizes(cur);sz=sl.indexOf("L")>-1?"L":sl[0];cl=(cur.colors||[])[0]||"";qty=1;pm();$("s1").classList.add("on");loadPrv(i);if(!sessionStorage.getItem("v"+i)){sessionStorage.setItem("v"+i,1);rp("bump_view",{pid:i})}}}
else if(k==="fav"){const x=fav.indexOf(i);if(x>-1){fav.splice(x,1);rp("bump_fav",{pid:i,d:-1})}else{fav.push(i);rp("bump_fav",{pid:i,d:1})}sv("msn_fav",fav);render()}
else if(k==="cat"){cat=v==="الكل"?"":v;onlyFav=false;render()}
else if(k==="sz"){sz=v;pm()}
else if(k==="cl"){cl=v;pm()}
else if(k==="qd"){qty=Math.max(1,qty-1);pm()}
else if(k==="qi"){qty=Math.min(10,stock(cur),qty+1);pm()}
else if(k==="add"){const f=cart.find(c=>c.id===cur.id&&c.size===sz&&c.color===cl);if(f)f.qty=Math.min(10,f.qty+qty);else cart.push({id:cur.id,name:cur.name,price:Number(cur.price),size:sz,color:cl,qty:qty});saveCart();$("s1").classList.remove("on");toast("اتضاف للسلة ✓")}
else if(k==="acc"){acc();$("s3").classList.add("on")}
else if(k==="login"){sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}
else if(k==="logout"){sb.auth.signOut().then(()=>{U=null;acc()})}
else if(k==="rate"){openRate(ORD[i])}
else if(k==="gen"){openRate({items:[]})}
else if(k==="st"){setStar(t.dataset.t,+v)}
else if(k==="rsub"){submitRate()}
else if(k==="close"){document.querySelectorAll(".sh").forEach(s=>s.classList.remove("on"))}
else if(k==="cart"){drawCart();payNote();$("wal").style.display="none";$("s2").classList.add("on")}
else if(k==="cd"){cart[i].qty--;if(cart[i].qty<1)cart.splice(i,1);saveCart()}
else if(k==="cu"){cart[i].qty=Math.min(10,cart[i].qty+1);saveCart()}
else if(k==="favs"){onlyFav=!onlyFav;render()}
else if(k==="home"){onlyFav=false;cat="";$("q").value="";$("pf").value="";render();scrollTo(0,0)}});
$("q").oninput=render;$("so").onchange=render;$("pf").onchange=render;$("pay").onchange=payNote;
$("go").onclick=()=>{
if(!cart.length)return toast("السلة فاضية");
const n=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim(),pay=$("pay").value;
if(n.length<2)return toast("اكتب اسمك");
if(!/^01[0125]\d{8}$/.test(ph))return toast("رقم الموبايل غير صحيح");
if(ad.length<8)return toast("اكتب العنوان بالتفصيل");
const PAY={cod:"الدفع عند الاستلام",vf:"فودافون كاش",ip:"انستا باي"}[pay],items=cart.slice(),total=tot(),tk=uid();
const m="🔥 طلب جديد من MSN 🔥\n👤 "+n+"\n📞 "+ph+"\n📍 "+ad+"\n💳 "+PAY+"\n\n"+items.map((i,k)=>(k+1)+". "+i.name+" — "+i.size+(i.color?" / "+i.color:"")+" × "+i.qty+" = "+i.price*i.qty+" ج.م").join("\n")+"\n\n💰 الإجمالي: "+total+" ج.م (غير شامل الشحن)";
const a=$("wal");a.href="https://wa.me/"+S.whatsapp+"?text="+encodeURIComponent(m);a.style.display="block";a.click();
if(sb)sb.from("orders").insert({name:n,phone:ph,address:ad,payment_method:PAY,items:items,total:total,status:"new",token:tk}).then(r=>toast(r.error?"اتفتح واتساب بس: ابعت الرسالة عشان الطلب يوصل":"الطلب اتسجّل ✓ ابعت رسالة واتساب للتأكيد"),()=>toast("اتفتح واتساب بس: ابعت الرسالة عشان الطلب يوصل"));
else toast("ابعت رسالة واتساب عشان الطلب يوصل");
cart=[];saveCart();ORD.unshift({token:tk,date:Date.now(),total:total,name:n,items:items.map(x=>({id:x.id,name:x.name}))});ORD=ORD.slice(0,20);sv("msn_orders",ORD);setTimeout(()=>{$("s2").classList.remove("on");openRate(ORD[0])},1500)};
$("soc").innerHTML='<a href="'+CFG.ig+'" target="_blank" rel="noopener">Instagram</a><a href="'+CFG.fb+'" target="_blank" rel="noopener">Facebook</a><a href="'+CFG.tt+'" target="_blank" rel="noopener">TikTok</a>';
(async()=>{chips();$("g").innerHTML='<p class="em">جاري التحميل...</p>';
if(!sb){$("g").innerHTML='<p class="em">تعذّر الاتصال. افتح الصفحة من متصفح وانت متصل بالإنترنت.</p>';return}
try{const s=await sb.from("settings").select("*");if(s.data)s.data.forEach(r=>{S[r.key]=r.value})}catch(e){}
$("bh").textContent=S.banner_title;$("bp").textContent=S.banner_text;$("nw").href="https://wa.me/"+S.whatsapp;
let ok=false;
try{const r=await sb.from("products").select("*").eq("active",true).order("id",{ascending:false});if(!r.error){P=r.data||[];ok=true}}catch(e){}
if(!ok){$("g").innerHTML='<p class="em">تعذّر تحميل المنتجات. جرّب تاني بعد شوية.</p>';return}
if(S.ads_enabled==="true"){try{const a=await sb.from("ads").select("*").eq("active",true);if(a.data)ADS=a.data.filter(x=>/^https?:\/\//.test(x.url))}catch(e){}}
const t=adOf("top");$("adtop").innerHTML=t?adHtml(t):"";
if(!sessionStorage.getItem("vis")){sessionStorage.setItem("vis",1);rp("bump_stat",{k:"visits"})}
render();upd();
try{const s=await sb.auth.getSession();U=s.data.session?s.data.session.user:null;if(uname()&&!$("nm").value)$("nm").value=uname()}catch(e){}
sb.auth.onAuthStateChange((ev,s)=>{U=s?s.user:null;if(uname()&&!$("nm").value)$("nm").value=uname()});
loadRev()})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
